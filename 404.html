<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Doron Linton Prince</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2305060b'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='monospace' font-weight='bold' fill='%2300e5ff'>D</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh; display:grid; place-items:center; text-align:center;
    background:#05060b; color:#e8ecf4; padding:2rem;
    font-family:'Space Grotesk',system-ui,sans-serif;
    background-image:radial-gradient(circle at 50% 0%,rgba(0,229,255,.13),transparent 58%);
  }
  h1{
    font-size:clamp(5rem,22vw,13rem); font-weight:700; line-height:.9;
    letter-spacing:-.05em;
    background:linear-gradient(140deg,#00e5ff,#8b5cf6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.k{
    font-family:'JetBrains Mono',monospace; font-size:.76rem;
    letter-spacing:.28em; text-transform:uppercase; color:#5d6478;
    margin:1.2rem 0 .8rem;
  }
  p.m{ color:#98a1b5; max-width:44ch; margin:0 auto 2.2rem; }
  a{
    display:inline-flex; align-items:center; gap:.55rem;
    padding:.85rem 1.7rem; border-radius:100px;
    color:#04050a; text-decoration:none; font-weight:500; font-size:.9rem;
    background:linear-gradient(120deg,#00e5ff,#8b5cf6);
    box-shadow:0 8px 34px rgba(0,229,255,.28);
    transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s;
  }
  a:hover{ transform:translateY(-2px); box-shadow:0 12px 46px rgba(0,229,255,.44); }
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p class="k">Signal lost</p>
    <p class="m">This page doesn't exist — or it moved somewhere I haven't documented yet.</p>
    <a href="/">← Back to the portfolio</a>
  </div>
</body>
</html>
